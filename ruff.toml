exclude     = [".venv", "site", "dist"]
line-length = 88

[lint]
    future-annotations = true
    ignore = [
        "blank-line-before-class",
        "incorrect-blank-line-before-class",
        "missing-copyright-notice",
        "missing-trailing-comma",
        "multi-line-summary-second-line",
    ]
    preview = true
    select = ["ALL"]

    [lint.flake8-bugbear]
        extend-immutable-calls = ["typer.Argument", "typer.Option"]

    # CLI defaults are Annotated typer.Typer parameters, not raw boolean traps.
    [lint.flake8-boolean-trap]
        extend-allowed-calls = ["typer.Argument", "typer.Option"]

    [lint.flake8-tidy-imports]
        ban-relative-imports = "all"

    [lint.flake8-type-checking]
        exempt-modules = ["typing", "typing_extensions"]
        runtime-evaluated-base-classes = ["pydantic.BaseModel"]
        runtime-evaluated-decorators = [
            "attrs.define",
            "attrs.frozen",
            "attrs.mutable",
            "dataclasses.dataclass",
            "pydantic.dataclasses.dataclass",
            "pydantic.validate_call",
        ]

    [lint.isort]
        combine-as-imports = true
        required-imports   = ["from __future__ import annotations"]

    [lint.per-file-ignores]
        # pytest idioms: tests are assertion-driven and have no production
        # assert surface to protect.
        "tests/**/*" = ["assert"]

        # Maintenance scripts: subprocess drives repo-owned tooling on
        # repo-controlled paths.
        "scripts/*" = ["suspicious-subprocess-import"]

    [lint.pyupgrade]
        keep-runtime-typing = true

[format]
    docstring-code-format = true
