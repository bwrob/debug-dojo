exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
    "**/.venv",
    "**/site",
]
interfaces = []
source_roots = ["src"]

exact                        = true
forbid_circular_dependencies = true
ignore_type_checking_imports = true

layers = ["cli", "core"]

respect_gitignore = true

[rules]
    require_ignore_directive_reasons = "error"
    unused_ignore_directives         = "error"


[[modules]]
    depends_on = []
    layer      = "core"
    path       = "debug_dojo"


[[modules]]
    depends_on = ["debug_dojo.cli"]
    layer      = "cli"
    path       = "debug_dojo.__main__"

[[modules]]
    depends_on = []
    layer      = "cli"
    path       = "debug_dojo.cli"
