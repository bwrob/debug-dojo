[project]
    edit_uri         = "edit/main/docs/"
    repo_name        = "bwrob/debug-dojo"
    repo_url         = "https://github.com/bwrob/debug-dojo"
    site_author      = "bwrob"
    site_description = "A place for zen debugging"
    site_name        = "Debug Dojo"
    site_url         = "https://bwrob.github.io/debug-dojo/"

    nav = [
        { "Overview" = "index.md" },
        { "Getting Started" = "getting-started.md" },
        { "Configuration" = "configuration.md" },
        { "CLI Reference" = "cli-reference.md" },
        { "API Reference" = "api-reference.md" },
        { "Architecture (ADRs)" = [
            "adr/index.md",
            { "ADR-0001: Record Architecture Decisions" = "adr/0001-record-architecture-decisions.md" },
        ] },
        { "Changelog" = "changelog.md" },
    ]

    extra_css = [
        "stylesheets/palette.css",
        "stylesheets/custom.css",

        "stylesheets/termynal.css",

    ]

    extra_javascript = [
        "javascripts/mathjax.js",
        "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",

        "javascripts/termynal.js",

    ]

    [project.validation]
        invalid_link_anchors  = true
        invalid_links         = true
        shadowed_definitions  = true
        shadowed_footnotes    = true
        unresolved_footnotes  = true
        unresolved_references = true
        unused_definitions    = true
        unused_footnotes      = true

    [project.theme]
        features = [
            "announce.dismiss",
            "content.action.edit",
            "content.action.view",
            "content.code.annotate",
            "content.code.copy",
            "content.code.select",
            "content.footnote.tooltips",
            "content.tabs.link",
            "content.tooltips",
            "navigation.footer",
            "navigation.indexes",
            "navigation.instant",
            "navigation.instant.prefetch",
            "navigation.instant.preview",
            "navigation.path",
            "navigation.top",
            "navigation.tracking",
            "search.highlight",
            "search.suggest",
            "toc.follow",
        ]
        language = "en"
        logo = "assets/python-logo.svg"

        [[project.theme.palette]]
            media       = "(prefers-color-scheme)"
            toggle.icon = "lucide/sun-moon"
            toggle.name = "Switch to light mode"

        [[project.theme.palette]]
            media       = "(prefers-color-scheme: light)"
            scheme      = "default"
            toggle.icon = "lucide/sun"
            toggle.name = "Switch to dark mode"

        [[project.theme.palette]]
            media       = "(prefers-color-scheme: dark)"
            scheme      = "slate"
            toggle.icon = "lucide/moon"
            toggle.name = "Switch to system preference"

    [[project.extra.social]]
        icon = "fontawesome/brands/github"
        link = "https://github.com/bwrob/debug-dojo"

    [project.markdown_extensions]
        abbr = {}
        admonition = {}
        attr_list = {}
        def_list = {}
        footnotes = {}
        md_in_html = {}
        pymdownx.arithmatex.generic = true
        pymdownx.betterem = {}
        pymdownx.caret = {}
        pymdownx.details = {}
        pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
        pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
        pymdownx.highlight.anchor_linenums = true
        pymdownx.highlight.line_spans = "__span"
        pymdownx.highlight.pygments_lang_class = true
        pymdownx.inlinehilite = {}
        pymdownx.keys = {}
        pymdownx.magiclink = {}
        pymdownx.mark = {}
        pymdownx.smartsymbols = {}
        pymdownx.snippets.check_paths = true
        pymdownx.snippets.dedent_subsections = true
        pymdownx.superfences.custom_fences = [
            { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
            { name = "tree", class = "tree", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
            { name = "markdown", class = "markdown", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
            { name = "md", class = "md", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
            { name = "python", class = "python", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
            { name = "bash", class = "bash", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
            { name = "sh", class = "sh", validator = "markdown_exec.validator", format = "markdown_exec.formatter" },
        ]
        pymdownx.tabbed.alternate_style = true
        pymdownx.tabbed.combine_header_slug = true
        pymdownx.tasklist.custom_checkbox = true
        pymdownx.tilde = {}
        toc.permalink = true
        zensical.extensions.preview.targets.include = ["*"]

    [project.plugins.gh-admonitions]

    [project.plugins.llmstxt]
        full_output = "llms-full.txt"

        [project.plugins.llmstxt.sections]
            "Documentation" = [
                "index.md",
                "getting-started.md",
                "configuration.md",
                "cli-reference.md",
                "api-reference.md",
                "adr/index.md",
                "adr/0001-record-architecture-decisions.md",
                "changelog.md",
            ]

    [project.plugins.markdown-exec]

    [project.plugins.mkdocstrings]
        default_handler = "python"

        [project.plugins.mkdocstrings.handlers.python]
            inventories                                   = ["https://docs.python.org/3/objects.inv"]
            options.annotations_path                      = "brief"
            options.backlinks                             = "tree"
            options.docstring_options.ignore_init_summary = true
            options.docstring_style                       = "numpy"
            options.extensions                            = ["griffe_warnings_deprecated"]
            options.line_length                           = 88
            options.members_order                         = "source"
            options.merge_init_into_class                 = true
            options.parameter_headings                    = true
            options.relative_crossrefs                    = true
            options.scoped_crossrefs                      = true
            options.separate_signature                    = true
            options.show_bases                            = true
            options.show_inheritance_diagram              = true
            options.show_root_heading                     = true
            options.show_signature_annotations            = true
            options.show_signature_type_parameters        = true
            options.show_source                           = true
            options.show_symbol_type_heading              = true
            options.show_symbol_type_toc                  = true
            options.signature_crossrefs                   = true
            options.summary                               = true
            options.type_parameter_headings               = true
            options.unwrap_annotated                      = true
            paths                                         = ["src"]
