exclude = [
    ".agents/skills/**/templates/**",
    ".temp/**",
    ".venv*/**",
    "build/**",
    "dist/**",
    "site/**",
]

[formatting]
    align_entries   = true
    compact_arrays  = true
    compact_entries = false
    indent_entries  = true
    indent_string   = "    "
    indent_tables   = true
    reorder_keys    = true
