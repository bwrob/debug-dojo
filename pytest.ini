[pytest]
addopts                = -q -ra --durations=3 -p no:legacypath --doctest-modules --import-mode=importlib --strict-config --strict-markers --snapshot-warn-unused
# Uncomment when using pytest-asyncio (0.24+) to configure default fixture loop scope:
# asyncio_default_fixture_loop_scope = function
collect_imported_tests = false
console_output_style   = classic
empty_parameter_set_mark = fail_at_collect
faulthandler_timeout   = 60
log_format             = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)
log_level              = DEBUG
minversion             = 9.0
strict                 = true
testpaths              = tests src
xfail_strict           = true
filterwarnings         =
    error
    ignore::coverage.exceptions.CoverageWarning
    ignore::DeprecationWarning:typer.*
    ignore::DeprecationWarning:click.*
    default::EncodingWarning
    error::EncodingWarning:debug_dojo.*
doctest_optionflags    =
    DONT_ACCEPT_TRUE_FOR_1
    NORMALIZE_WHITESPACE
    ELLIPSIS
