[project]
    authors = [
        { name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" },
    ]
    classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: Software Development :: Debuggers",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    dependencies = [
        "dacite>=1.0.0",
        "rich>=15.0.0",
        "tomlkit>=0.7.0",
        "typer>=0.16.0",
    ]
    description = "🏣 debug dojo, a place for zen debugging"
    license = "MIT"
    license-files = ["LICENSE"]
    name = "debug-dojo"
    readme = "README.md"
    requires-python = ">=3.12"
    version = "0.9.0"

    [project.urls]
        Documentation = "https://bwrob.github.io/debug-dojo/"
        Homepage      = "https://github.com/bwrob/debug-dojo"
        Issues        = "https://github.com/bwrob/debug-dojo/issues"
        Repository    = "https://github.com/bwrob/debug-dojo.git"

    [project.scripts]
        dojo = "debug_dojo._cli:main"

    [project.optional-dependencies]
        all-debuggers = ["debugpy>=1.0.0", "ipdb>=0.13.13", "pudb>=2020.1"]

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.12.7,<0.14.0"]

[dependency-groups]
    dev = [
        "poethepoet>=0.42.0",
        "prek>=0.5.5",
        { include-group = "test" },
        { include-group = "lint" },
        { include-group = "docs" },
        { include-group = "mutation" },
    ]
    docs = [
        "griffe-warnings-deprecated>=1.1.0",
        "markdown-exec>=1.12.0",
        "mkdocstrings[python]>=1.0.7",
        "termynal>=0.14.0",
        "typst>=0.13.0",
        "zensical>=0.0.70",
    ]
    lint = [
        "complexipy>=8.0.0",
        "deptry>=0.25.1",
        "griffe>=1.5.0",
        "pyrefly>=1.3.0",
        "ruff>=0.17.0",
        "rumdl>=0.2.75",
        "tach>=0.35.0",
        "taplo>=0.9.3",
        "typos>=1.30.0",
        "zizmor>=1.23.0",
    ]
    mutation = ["cosmic-ray>=8.7.0", "mutmut>=3.8.0"]
    test = [
        "hypothesis>=6.125.0",
        "pytest>=9.0.0",
        "pytest-cov>=7.0.0",
        "pytest-randomly>=3.16.0",
        "pytest-sugar>=1.1.1",
        "pytest-xdist>=3.8.0",
        "syrupy>=6.1.0",
        "debug-dojo[all-debuggers]",
    ]

[tool.uv]
    default-groups = ["dev", "test", "lint", "docs", "mutation"]
    package        = true

    [tool.uv.sources]
        taplo = { path = "../taplo", marker = "sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')" }

    [tool.uv.build-backend]
        source-include = [
            "tests/**",
            "poe_tasks.toml",
            "ruff.toml",
            "pytest.ini",
            ".coveragerc",
            "tach.toml",
            ".zizmor.yml",
            "cosmic-ray.toml",
        ]

[tool.mutmut]
    runner       = "pytest"
    source_paths = ["src/"]

[tool.poe]
    include = "poe_tasks.toml"
