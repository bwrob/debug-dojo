version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "ci"
      labels:
          - "dependencies"
          - "github_actions"
      groups:
          github-actions:
              patterns: ["*"]

    - package-ecosystem: "uv"
      directory: "/"
      schedule:
          interval: "weekly"
      cooldown:
          default-days: 7
      commit-message:
          prefix: "deps"
      labels:
          - "dependencies"
          - "python"
      groups:
          python-dependencies:
              patterns: ["*"]
