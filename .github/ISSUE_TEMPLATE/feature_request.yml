name: 💡 Feature Request
description: Suggest an idea or feature enhancement for Debug Dojo
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: markdown
      attributes:
          value: |
              Thank you for helping evolve Debug Dojo!
    - type: textarea
      id: problem
      attributes:
          label: Problem Statement / Use Case
          description: Is your feature request related to a problem or limitation?
          placeholder: A clear and concise description of the problem or need...
      validations:
          required: true
    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed Solution / API Design
          description: Describe the ideal interface or behavior.
          placeholder: Code snippets or architectural suggestions...
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternative Solutions Considered
          description: What alternative approaches or workarounds have you considered?
      validations:
          required: false
    - type: checkboxes
      id: checks
      attributes:
          label: Quality Check
          options:
              - label: I searched existing issues to ensure this feature hasn't already been suggested.
                required: true
