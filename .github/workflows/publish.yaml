name: Publish to PyPI and TestPyPI

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Build distributions
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # Required for Sigstore OIDC build provenance signing
            attestations: write # Required to store PEP 740 build provenance attestations
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install uv and setup Python
              uses: astral-sh/setup-uv@v10.3.2
              with:
                  python-version: "3.12"
                  enable-cache: false

            - name: Set dependency resolution cutoff
              shell: bash
              run: echo "UV_EXCLUDE_NEWER=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"

            - name: Build distributions
              run: uv build

            - name: Verify wheel imports in isolated environment
              run: python scripts/verify_wheel.py

            - name: Attest build provenance
              if: "!env.ACT"
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: "dist/*"

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: python-package-distributions
                  path: dist/

    publish-testpypi:
        name: Publish to TestPyPI
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'
        environment:
            name: testpypi
            url: https://test.pypi.org/p/debug-dojo
        permissions:
            id-token: write # Required for TestPyPI Trusted Publishing OIDC token
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  attestations: true

    publish-pypi:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        environment:
            name: pypi
            url: https://pypi.org/p/debug-dojo
        permissions:
            id-token: write # Required for PyPI Trusted Publishing OIDC token
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v8
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  attestations: true
