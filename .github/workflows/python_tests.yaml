name: Package Tests

env:
    UV_NO_SYNC: true
    PYTHONWARNDEFAULTENCODING: "1"
    PYTHONUTF8: "1"
    UV_NO_SOURCES_PACKAGE: taplo

permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: 🎨 Code Quality & Static Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install uv and setup Python
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: "3.12"
                  enable-cache: true

            - name: Set dependency resolution cutoff
              shell: bash
              run: echo "UV_EXCLUDE_NEWER=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"

            - name: 🛠️ Install project dependencies
              run: uv sync

            - name: 🐍 Run ruff linter check
              run: uv run poe lint

            - name: 🐍 Run ruff formatter check
              run: uv run poe format-check

            - name: 🐍 Run pyrefly static type checker
              run: uv run poe type-check

            - name: 🔍 Run pyrefly type coverage and completeness check
              run: uv run poe type-coverage

            - name: 🧮 Run complexipy complexity check
              run: uv run poe complexity

            - name: 📝 Run rumdl markdown linter
              run: uv run poe lint-md

            - name: 🔤 Run typos spell checker
              run: uv run poe typos

            - name: 📐 Run tach architecture check
              run: uv run poe dependencies

            - name: 🛡️ Run zizmor GitHub Actions security audit
              run: uv run poe zizmor

            - name: 🔍 Check public API breaking changes against target
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  git fetch origin "$BASE_REF" --depth=1 || true
                  uv run griffe check debug_dojo --search src --against "origin/$BASE_REF" -f github || true

            - name: 📋 Summarize quality failures
              if: failure()
              run: |
                  echo "### ⚠️ Code Quality Check Failed" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "To inspect, format, and fix issues locally, run:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```bash' >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe fix          # Auto-format and fix linter/spelling issues" >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe code-quality # Run full verification gate locally" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    test:
        name: 🐍 Python Tests Matrix
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.12", "3.13", "3.14", "3.15"]

        steps:
            - name: 🛠️ Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: 🛠️ Install uv and use Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: 🛠️ Set dependency resolution cutoff
              shell: bash
              run: echo "UV_EXCLUDE_NEWER=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"

            - name: 🛠️ Install project dependencies
              run: uv sync --frozen --group test

            - name: 🧪 Run pytest suite
              run: uv run poe test

            - name: 📊 Upload coverage report to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
              uses: codecov/codecov-action@v7
              with:
                  files: coverage.xml
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: 🧹 Verify clean working tree after tests
              shell: bash
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "::error::Tests left untracked or modified files in the working tree:"
                    git status --short
                    exit 1
                  fi

            - name: 📋 Summarize test failures
              if: failure()
              env:
                  MATRIX_OS: ${{ matrix.os }}
                  MATRIX_PYTHON: ${{ matrix.python-version }}
              run: |
                  echo "### ⚠️ Python Tests Failed on ${MATRIX_OS} (Python ${MATRIX_PYTHON})" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "To reproduce test failures locally, run:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```bash' >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe test" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    test-lowest:
        name: 🔬 Lowest Direct Dependencies Verification
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install uv and setup Python
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: "3.12"
                  enable-cache: true

            - name: Set dependency resolution cutoff
              shell: bash
              run: echo "UV_EXCLUDE_NEWER=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"

            - name: 🛠️ Install lowest-direct project dependencies
              run: uv sync --group test --resolution lowest-direct

            - name: 🧪 Run pytest suite against lowest dependencies
              run: uv run poe test

            - name: 📋 Summarize lowest-dependencies test failures
              if: failure()
              run: |
                  echo "### ⚠️ Lowest-Dependencies Test Failed" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "One or more declared minimum dependency versions in \`pyproject.toml\` are incompatible." >> "$GITHUB_STEP_SUMMARY"
                  echo "To reproduce and debug locally, run:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```bash' >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe test-lowest" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    test-dist:
        name: 📦 Distribution Wheel Verification
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Install uv and setup Python
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  python-version: "3.12"
                  enable-cache: true

            - name: Set dependency resolution cutoff
              shell: bash
              run: echo "UV_EXCLUDE_NEWER=$(python3 -c 'import datetime; print((datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=1)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"

            - name: 🛠️ Install project dependencies
              run: uv sync

            - name: 📦 Build and test wheel package
              run: uv run poe test-dist

            - name: 📋 Summarize distribution package failures
              if: failure()
              run: |
                  echo "### ⚠️ Distribution Package Verification Failed" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "To reproduce wheel build and distribution testing locally, run:" >> "$GITHUB_STEP_SUMMARY"
                  echo '```bash' >> "$GITHUB_STEP_SUMMARY"
                  echo "uv run poe test-dist" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    check:
        name: 🛠️ Check if all jobs succeeded
        if: always()
        needs:
            - quality
            - test
            - test-lowest
            - test-dist
        runs-on: ubuntu-latest
        steps:
            - name: Decide whether all required jobs succeeded
              uses: re-actors/alls-green@release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
